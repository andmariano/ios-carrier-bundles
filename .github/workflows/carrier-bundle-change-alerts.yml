name: Carrier Bundle Change Alerts

on:
  push:
    branches: [main]
    paths:
      - 'Carrier Bundles/**'
      - 'Country Bundles/**'
      - 'ipsw_metadata.json'
  workflow_dispatch:
    inputs:
      base_version:
        description: "Base iOS version (preferred for custom version compare, example: 26.0)"
        required: false
        default: ""
      base_build:
        description: "Base iOS build (optional, supports beta/RC targeting, example: 23E5222f)"
        required: false
        default: ""
      base_url:
        description: "Base IPSW direct URL (optional override when build/version resolution is unavailable)"
        required: false
        default: ""
      head_version:
        description: "Head iOS version (preferred for custom version compare, example: 26.3)"
        required: false
        default: ""
      head_build:
        description: "Head iOS build (optional, supports beta/RC targeting, example: 23E5230a)"
        required: false
        default: ""
      head_url:
        description: "Head IPSW direct URL (optional override when build/version resolution is unavailable)"
        required: false
        default: ""
      base_ref:
        description: "Base git ref/commit fallback (example: ios-26.0 or commit SHA)"
        required: false
        default: ""
      head_ref:
        description: "Head git ref/commit fallback (example: ios-26.3 or commit SHA)"
        required: false
        default: ""
      device:
        description: "Device identifier used when version download fallback is needed"
        required: false
        default: iPhone18,3
      include_beta:
        description: "Include beta/RC releases when downloading by version/build"
        required: false
        default: "true"
      release_tag:
        description: "Optional prerelease label for issue tagging (example: beta2, beta3, rc1)"
        required: false
        default: ""

env:
  DEVICE: ${{ github.event.inputs.device || 'iPhone18,3' }}

jobs:
  generate-report:
    name: Generate Change Report + Create Issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve compare inputs
        id: refs
        run: |
          resolve_input() {
            local raw_input="$1"
            local raw_build="$2"
            local raw_url="$3"
            local fallback_git_sha="$4"
            local source=""
            local value=""
            local build=""
            local url=""
            local sha=""
            local label=""

            if [ -n "$raw_url" ]; then
              source="url"
              value="$raw_url"
              url="$raw_url"
              label="url:${raw_url}"
            elif [ -n "$raw_build" ]; then
              source="version"
              value="$raw_input"
              build="$raw_build"
              if [ -n "$raw_input" ]; then
                label="version:${raw_input} (build:${raw_build})"
              else
                label="build:${raw_build}"
              fi
            elif [ -n "$raw_input" ]; then
              if git rev-parse --verify --quiet "${raw_input}^{commit}" >/dev/null; then
                source="git"
                sha=$(git rev-parse "${raw_input}^{commit}")
                value="$sha"
                label="git:${raw_input} (${sha})"
              else
                source="version"
                value="$raw_input"
                label="version:${raw_input}"
              fi
            else
              source="git"
              sha="$fallback_git_sha"
              value="$sha"
              label="git:${sha}"
            fi

            echo "$source|$value|$build|$url|$sha|$label"
          }

          DEFAULT_HEAD_SHA="${GITHUB_SHA}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            DEFAULT_BASE_SHA="${{ github.event.before }}"
          else
            DEFAULT_BASE_SHA=$(git rev-parse "${DEFAULT_HEAD_SHA}^")
          fi

          BASE_INPUT="${{ github.event.inputs.base_version || github.event.inputs.base_ref }}"
          HEAD_INPUT="${{ github.event.inputs.head_version || github.event.inputs.head_ref }}"
          BASE_BUILD_INPUT="${{ github.event.inputs.base_build }}"
          HEAD_BUILD_INPUT="${{ github.event.inputs.head_build }}"
          BASE_URL_INPUT="${{ github.event.inputs.base_url }}"
          HEAD_URL_INPUT="${{ github.event.inputs.head_url }}"

          HEAD_RESULT=$(resolve_input "$HEAD_INPUT" "$HEAD_BUILD_INPUT" "$HEAD_URL_INPUT" "$DEFAULT_HEAD_SHA")
          BASE_RESULT=$(resolve_input "$BASE_INPUT" "$BASE_BUILD_INPUT" "$BASE_URL_INPUT" "$DEFAULT_BASE_SHA")

          HEAD_SOURCE=$(echo "$HEAD_RESULT" | cut -d'|' -f1)
          HEAD_VALUE=$(echo "$HEAD_RESULT" | cut -d'|' -f2)
          HEAD_BUILD=$(echo "$HEAD_RESULT" | cut -d'|' -f3)
          HEAD_URL=$(echo "$HEAD_RESULT" | cut -d'|' -f4)
          HEAD_SHA=$(echo "$HEAD_RESULT" | cut -d'|' -f5)
          HEAD_LABEL=$(echo "$HEAD_RESULT" | cut -d'|' -f6-)

          BASE_SOURCE=$(echo "$BASE_RESULT" | cut -d'|' -f1)
          BASE_VALUE=$(echo "$BASE_RESULT" | cut -d'|' -f2)
          BASE_BUILD=$(echo "$BASE_RESULT" | cut -d'|' -f3)
          BASE_URL=$(echo "$BASE_RESULT" | cut -d'|' -f4)
          BASE_SHA=$(echo "$BASE_RESULT" | cut -d'|' -f5)
          BASE_LABEL=$(echo "$BASE_RESULT" | cut -d'|' -f6-)

          NEEDS_DOWNLOAD="false"
          if [ "$BASE_SOURCE" = "version" ] || [ "$HEAD_SOURCE" = "version" ]; then
            NEEDS_DOWNLOAD="true"
          fi

          {
            echo "base_source=$BASE_SOURCE"
            echo "base_value=$BASE_VALUE"
            echo "base_build=$BASE_BUILD"
            echo "base_url=$BASE_URL"
            echo "base_sha=$BASE_SHA"
            echo "base_label=$BASE_LABEL"
            echo "head_source=$HEAD_SOURCE"
            echo "head_value=$HEAD_VALUE"
            echo "head_build=$HEAD_BUILD"
            echo "head_url=$HEAD_URL"
            echo "head_sha=$HEAD_SHA"
            echo "head_label=$HEAD_LABEL"
            echo "needs_download=$NEEDS_DOWNLOAD"
          } >> "$GITHUB_OUTPUT"

          echo "Base compare target: $BASE_LABEL"
          echo "Head compare target: $HEAD_LABEL"
          echo "Needs download fallback: $NEEDS_DOWNLOAD"

      - name: Install download/extract dependencies (fallback mode)
        if: steps.refs.outputs.needs_download == 'true'
        run: |
          BUILD_DEPS='fuse3 unzip lzma libfuse3-dev bzip2 libbz2-dev libz-dev cmake build-essential git libattr1-dev'

          sudo apt update
          sudo apt install $BUILD_DEPS -y
          sudo modprobe fuse

          git clone https://github.com/sgan81/apfs-fuse.git /tmp/apfs-fuse
          cd /tmp/apfs-fuse
          git submodule init
          git submodule update
          mkdir build
          cd build
          cmake ..
          sudo make install

          cd ${GITHUB_WORKSPACE}
          rm -rf /tmp/apfs-fuse

          DEB_ARCH="amd64"
          case "$DEB_ARCH" in
            amd64) DEB_ASSET_ARCH="x86_64" ;;
            arm64) DEB_ASSET_ARCH="arm64" ;;
            *) DEB_ASSET_ARCH="$DEB_ARCH" ;;
          esac

          IPSW_DEB_URL=$(curl -fsSL https://api.github.com/repos/blacktop/ipsw/releases/latest | \
          jq -r --arg arch "$DEB_ASSET_ARCH" '[.assets[].browser_download_url | select(test("/ipsw_[^/]*_linux_" + $arch + "\\.deb$"))] | first // empty')

          if [ -z "$IPSW_DEB_URL" ]; then
            echo "::error::Failed to resolve ipsw .deb URL for architecture ${DEB_ARCH} (asset arch ${DEB_ASSET_ARCH})."
            exit 1
          fi

          echo "Resolved ipsw .deb URL: $IPSW_DEB_URL"

          curl -fsSL -o /tmp/ipsw.deb "$IPSW_DEB_URL"
          sudo dpkg -i /tmp/ipsw.deb
          rm /tmp/ipsw.deb

      - name: Preflight compare targets
        id: preflight
        run: |
          set -euo pipefail

          BASE_SOURCE="${{ steps.refs.outputs.base_source }}"
          HEAD_SOURCE="${{ steps.refs.outputs.head_source }}"
          BASE_SHA="${{ steps.refs.outputs.base_sha }}"
          HEAD_SHA="${{ steps.refs.outputs.head_sha }}"
          BASE_VALUE="${{ steps.refs.outputs.base_value }}"
          HEAD_VALUE="${{ steps.refs.outputs.head_value }}"
          BASE_BUILD="${{ steps.refs.outputs.base_build }}"
          HEAD_BUILD="${{ steps.refs.outputs.head_build }}"
          BASE_URL="${{ steps.refs.outputs.base_url }}"
          HEAD_URL="${{ steps.refs.outputs.head_url }}"
          INCLUDE_BETA="${{ github.event.inputs.include_beta || 'true' }}"

          PROCEED="true"
          REASON=""
          BASE_RESOLVED_BUILD=""
          HEAD_RESOLVED_BUILD=""
          BASE_VERSION_BETA_UNRESOLVED="false"
          HEAD_VERSION_BETA_UNRESOLVED="false"

          supports_beta_flag="false"
          if [ "${{ steps.refs.outputs.needs_download }}" = "true" ]; then
            if [ "$INCLUDE_BETA" = "true" ] && ipsw download ipsw --help 2>&1 | grep -q -- '--beta'; then
              supports_beta_flag="true"
            fi
          fi

          if [ "$INCLUDE_BETA" = "true" ] && [ "$supports_beta_flag" = "false" ]; then
            if [ "$BASE_SOURCE" = "version" ] && [ -n "$BASE_VALUE" ] && [ -z "$BASE_BUILD" ] && [ -z "$BASE_URL" ]; then
              BASE_VERSION_BETA_UNRESOLVED="true"
            fi
            if [ "$HEAD_SOURCE" = "version" ] && [ -n "$HEAD_VALUE" ] && [ -z "$HEAD_BUILD" ] && [ -z "$HEAD_URL" ]; then
              HEAD_VERSION_BETA_UNRESOLVED="true"
            fi
          fi

          resolve_effective_build() {
            local side="$1"
            local source="$2"
            local version="$3"
            local build="$4"
            local url="$5"

            if [ "$source" = "git" ]; then
              echo ""
              return 0
            fi

            if [ "$source" = "url" ] && [ -n "$url" ]; then
              echo "Preflight: validating ${side} direct URL" >&2
              if curl -IfsSL --connect-timeout 10 --retry 2 "$url" >/dev/null; then
                echo "url:${url}"
                return 0
              fi
              echo "::error::Preflight failed for ${side} direct URL." >&2
              return 1
            fi

            if [ -n "$build" ]; then
              echo "Preflight: validating ${side} explicit build ${build}" >&2
              if ipsw download ipsw --device "${DEVICE}" --build "$build" --urls --no-color >/tmp/${side}-build-urls.txt 2>/tmp/${side}-build-preflight.err; then
                echo "$build"
                return 0
              fi

              if python3 scripts/resolve_build.py --device "${DEVICE}" --build "$build" >/tmp/${side}-resolved-build.json 2>>/tmp/${side}-build-preflight.err; then
                local resolved_url
                resolved_url=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("url",""))' /tmp/${side}-resolved-build.json | tr -d '\r' | xargs)
                if [ -n "$resolved_url" ] && curl -IfsSL --connect-timeout 10 --retry 2 "$resolved_url" >/dev/null; then
                  echo "$build"
                  return 0
                fi
              fi

              echo "::error::Preflight failed for ${side} build ${build}."
              if [ -s /tmp/${side}-build-preflight.err ]; then
                echo "Preflight details (${side}):" >&2
                cat /tmp/${side}-build-preflight.err >&2
              fi
              return 1
            fi

            if [ -n "$version" ]; then
              local resolved
              local cmd=(ipsw download ipsw --device "${DEVICE}" --version "$version" --show-latest-build --no-color)
              if [ "$INCLUDE_BETA" = "true" ] && [ "$supports_beta_flag" = "true" ]; then
                cmd+=(--beta)
              fi

              resolved=$("${cmd[@]}" | tr -d '\r' | tail -n1 | xargs)
              if [ -z "$resolved" ]; then
                echo "::error::Preflight failed resolving ${side} version ${version}."
                return 1
              fi
              echo "$resolved"
              return 0
            fi

            echo "::error::Preflight missing both version and build for ${side}."
            return 1
          }

          if [ "$BASE_SOURCE" = "git" ] && [ "$HEAD_SOURCE" = "git" ] && [ -n "$BASE_SHA" ] && [ "$BASE_SHA" = "$HEAD_SHA" ]; then
            PROCEED="false"
            REASON="Base and head resolve to the same git commit (${BASE_SHA})."
          fi

          if [ "$PROCEED" = "true" ] && [ "${{ steps.refs.outputs.needs_download }}" = "true" ]; then
            if ! BASE_RESOLVED_BUILD=$(resolve_effective_build "base" "$BASE_SOURCE" "$BASE_VALUE" "$BASE_BUILD" "$BASE_URL"); then
              PROCEED="false"
              if [ -n "$BASE_BUILD" ]; then
                REASON="Preflight failed validating base build ${BASE_BUILD}. This build may no longer be available in public Apple/ipsw feeds for ${DEVICE}. Use base_url with a direct Apple CDN IPSW URL if you have one."
              else
                REASON="Preflight failed validating base target."
              fi
            fi

            if [ "$PROCEED" = "true" ] && ! HEAD_RESOLVED_BUILD=$(resolve_effective_build "head" "$HEAD_SOURCE" "$HEAD_VALUE" "$HEAD_BUILD" "$HEAD_URL"); then
              PROCEED="false"
              if [ -n "$HEAD_BUILD" ]; then
                REASON="Preflight failed validating head build ${HEAD_BUILD}. This build may no longer be available in public Apple/ipsw feeds for ${DEVICE}. Use head_url with a direct Apple CDN IPSW URL if you have one."
              else
                REASON="Preflight failed validating head target."
              fi
            fi

            if [ -n "$BASE_RESOLVED_BUILD" ] && [ -n "$HEAD_RESOLVED_BUILD" ] && [ "$BASE_RESOLVED_BUILD" = "$HEAD_RESOLVED_BUILD" ]; then
              PROCEED="false"
              if [ "$BASE_VERSION_BETA_UNRESOLVED" = "true" ] || [ "$HEAD_VERSION_BETA_UNRESOLVED" = "true" ]; then
                REASON="Base/head resolved to same stable build (${BASE_RESOLVED_BUILD}) because runner ipsw lacks --beta support. Provide explicit build(s) (base_build/head_build) or direct URL(s) (base_url/head_url) for beta comparisons."
              else
                REASON="Base and head resolve to the same iOS build (${BASE_RESOLVED_BUILD}); nothing to compare."
              fi
            fi
          fi

          {
            echo "proceed=$PROCEED"
            echo "reason=$REASON"
            echo "base_resolved_build=$BASE_RESOLVED_BUILD"
            echo "head_resolved_build=$HEAD_RESOLVED_BUILD"
          } >> "$GITHUB_OUTPUT"

          if [ "$PROCEED" = "false" ]; then
            echo "::notice::Skipping comparison: $REASON"
          fi

      - name: Prepare comparison trees
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          INCLUDE_BETA="${{ github.event.inputs.include_beta || 'true' }}"
          echo "Include beta releases for fallback downloads: ${INCLUDE_BETA}"

          download_and_extract_version() {
            local side="$1"
            local version="$2"
            local build="$3"
            local url="$4"
            local include_beta="$5"

            local side_root="/tmp/${side}-bundles"
            local ipsw_dir="/tmp/${side}-ipsw"
            local extract_dir="/tmp/${side}-extract"
            local beta_flag=()
            local supports_beta_flag="false"

            if [ "$include_beta" = "true" ]; then
              if ipsw download ipsw --help 2>&1 | grep -q -- '--beta'; then
                beta_flag=(--beta)
                supports_beta_flag="true"
              else
                echo "::warning::include_beta=true but installed ipsw does not support --beta; using API fallback for ${side}."
              fi
            fi

            rm -rf "$side_root" "$ipsw_dir" "$extract_dir"
            mkdir -p "$side_root" "$ipsw_dir" "$extract_dir"

            if [ -n "$url" ]; then
              echo "Downloading ${side} from direct URL..."
              curl -fsSL -o "$ipsw_dir/${side}.ipsw" "$url"
            elif [ -n "$build" ]; then
              build_download_ok="false"

              echo "Attempting direct build download for ${build}..."
              if ipsw download ipsw --device "${DEVICE}" --build "$build" "${beta_flag[@]}" --confirm --no-color --output "$ipsw_dir"; then
                build_download_ok="true"
              else
                echo "::warning::Direct build download failed for ${build}; trying API URL resolution fallback."
              fi

              if [ "$build_download_ok" = "false" ]; then
                BUILD_JSON=""
                if BUILD_JSON=$(python3 scripts/resolve_build.py --device "${DEVICE}" --build "$build" 2>/tmp/resolve_build.err); then
                  RESOLVED_URL=$(echo "${BUILD_JSON}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("url",""))' | tr -d '\r' | xargs)
                else
                  RESOLVED_URL=""
                fi

                if [ -z "${RESOLVED_URL}" ]; then
                  echo "::error::Failed to download/resolve build ${build} for device ${DEVICE}."
                  if [ -s /tmp/resolve_build.err ]; then
                    echo "Resolver error output:"
                    cat /tmp/resolve_build.err
                  fi
                  exit 1
                fi

                echo "Downloading from resolved URL: ${RESOLVED_URL}"
                curl -fsSL -o "$ipsw_dir/${build}.ipsw" "${RESOLVED_URL}"
              fi
            elif [ -n "$version" ]; then
              ipsw download ipsw --device "${DEVICE}" --version "$version" "${beta_flag[@]}" --confirm --no-color --output "$ipsw_dir"
            else
              echo "::error::Missing both version and build for ${side} download target"
              exit 1
            fi
            ipsw extract --files --pattern '.*Bundles.*iPhone.*\.bundle.*$' --output "$extract_dir" "$ipsw_dir"/*.ipsw

            sudo chown -R "$USER" "$extract_dir"/*/root

            mkdir -p "$side_root/Carrier Bundles" "$side_root/Country Bundles"
            cp -R "$extract_dir"/*/root/System/Library/Carrier\ Bundles/iPhone/* "$side_root/Carrier Bundles"/

            if compgen -G "$extract_dir/*/root/System/Library/CountryBundles/iPhone/*" > /dev/null; then
              cp -R "$extract_dir"/*/root/System/Library/CountryBundles/iPhone/* "$side_root/Country Bundles"/
            fi

            IPSW_INFO=$(ipsw info "$ipsw_dir"/*.ipsw --json --no-color)
            echo "$IPSW_INFO" > "$side_root/ipsw_metadata.json"
          }

          rm -rf /tmp/base-bundles /tmp/head-bundles

          if [ "${{ steps.refs.outputs.base_source }}" = "git" ]; then
            git worktree add --detach /tmp/base-bundles "${{ steps.refs.outputs.base_sha }}"
          else
            download_and_extract_version base "${{ steps.refs.outputs.base_value }}" "${{ steps.refs.outputs.base_build }}" "${{ steps.refs.outputs.base_url }}" "${INCLUDE_BETA}"
          fi

          if [ "${{ steps.refs.outputs.head_source }}" = "git" ]; then
            git worktree add --detach /tmp/head-bundles "${{ steps.refs.outputs.head_sha }}"
          else
            download_and_extract_version head "${{ steps.refs.outputs.head_value }}" "${{ steps.refs.outputs.head_build }}" "${{ steps.refs.outputs.head_url }}" "${INCLUDE_BETA}"
          fi

      - name: Build carrier bundle diff report
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          python3 scripts/cb_change_report.py \
            --old-dir "/tmp/base-bundles/Carrier Bundles" \
            --new-dir "/tmp/head-bundles/Carrier Bundles" \
            --output-json "${GITHUB_WORKSPACE}/reports/cb-change-report.json" \
            --output-md "${GITHUB_WORKSPACE}/reports/cb-change-report.md"

      - name: Skip when no actionable comparison
        if: steps.preflight.outputs.proceed != 'true'
        run: |
          echo "Skipping report and issue creation."
          echo "Reason: ${{ steps.preflight.outputs.reason }}"
          echo "Base resolved build: ${{ steps.preflight.outputs.base_resolved_build }}"
          echo "Head resolved build: ${{ steps.preflight.outputs.head_resolved_build }}"

      - name: Prepare issue content
        id: issue_data
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          IOS_VERSION=$(jq -r '.version // "unknown"' /tmp/head-bundles/ipsw_metadata.json 2>/dev/null || echo "unknown")
          IOS_BUILD=$(jq -r '.build // "unknown"' /tmp/head-bundles/ipsw_metadata.json 2>/dev/null || echo "unknown")
          IOS_OS=$(jq -r '.os // ""' /tmp/head-bundles/ipsw_metadata.json 2>/dev/null || echo "")
          IOS_IS_BETA="false"

          # Query ipsw.me for full release name including beta number (e.g. "26.4 beta 4")
          IOS_FULL_VERSION=""
          if [ -n "$IOS_BUILD" ] && [ "$IOS_BUILD" != "unknown" ]; then
            IOS_FULL_VERSION=$(curl -fsSL "https://api.ipsw.me/v4/device/${DEVICE}?type=ipsw" 2>/dev/null | \
              jq -r --arg b "$IOS_BUILD" '.firmwares[]? | select(.buildid==$b) | .version' 2>/dev/null | \
              head -n1 | tr -d '\r' | xargs || true)
          fi

          if [ -n "$IOS_FULL_VERSION" ]; then
            IOS_VERSION_LABEL="$IOS_FULL_VERSION"
            if echo "$IOS_FULL_VERSION" | grep -qiE 'beta|rc|seed|development'; then
              IOS_IS_BETA="true"
            fi
          else
            IOS_VERSION_LABEL="${IOS_VERSION}"
            if [[ "$IOS_BUILD" =~ [a-z]$ ]] || [[ "$IOS_OS" =~ [Dd]evelopment|[Bb]eta|[Ss]eed|[Rr][Cc] ]]; then
              IOS_VERSION_LABEL="${IOS_VERSION} beta"
              IOS_IS_BETA="true"
            fi
          fi

          PORTUGAL_CHANGED="false"
          PT_CARRIER_CHANGED="false"
          TITLE_PREFIX=""

          PORTUGAL_BASE="/tmp/base-bundles/Country Bundles/Portugal.bundle"
          PORTUGAL_HEAD="/tmp/head-bundles/Country Bundles/Portugal.bundle"
          if [ -d "$PORTUGAL_BASE" ] || [ -d "$PORTUGAL_HEAD" ]; then
            python3 scripts/detailed_dir_diff.py \
              --base-dir "$PORTUGAL_BASE" \
              --head-dir "$PORTUGAL_HEAD" > /tmp/portugal_changes.txt
          else
            : > /tmp/portugal_changes.txt
          fi

          if [ -s /tmp/portugal_changes.txt ]; then
            PORTUGAL_CHANGED="true"
            TITLE_PREFIX="${TITLE_PREFIX}[Portugal Country Bundle Changed] "
          fi

          : > /tmp/pt_carrier_bundle_changes.txt
          PT_BUNDLE_LIST=$( {
            find "/tmp/base-bundles/Carrier Bundles" -mindepth 1 -maxdepth 1 -type d -name '*_pt.bundle' -printf '%f\n' 2>/dev/null || true
            find "/tmp/head-bundles/Carrier Bundles" -mindepth 1 -maxdepth 1 -type d -name '*_pt.bundle' -printf '%f\n' 2>/dev/null || true
          } | sort -u )

          while IFS= read -r bundle_name; do
            [ -z "$bundle_name" ] && continue

            BASE_DIR="/tmp/base-bundles/Carrier Bundles/${bundle_name}"
            HEAD_DIR="/tmp/head-bundles/Carrier Bundles/${bundle_name}"

            if [ -d "$BASE_DIR" ] || [ -d "$HEAD_DIR" ]; then
              BUNDLE_DIFF=$(python3 scripts/detailed_dir_diff.py \
                --base-dir "$BASE_DIR" \
                --head-dir "$HEAD_DIR")

              if [ -n "$BUNDLE_DIFF" ]; then
                {
                  echo "===== ${bundle_name} ====="
                  echo "$BUNDLE_DIFF"
                  echo
                } >> /tmp/pt_carrier_bundle_changes.txt
              fi
            fi
          done <<< "$PT_BUNDLE_LIST"

          if [ -s /tmp/pt_carrier_bundle_changes.txt ]; then
            PT_CARRIER_CHANGED="true"
            TITLE_PREFIX="${TITLE_PREFIX}[_pt Carrier Bundles Changed] "
          fi

          mkdir -p "${GITHUB_WORKSPACE}/reports"
          cp /tmp/portugal_changes.txt "${GITHUB_WORKSPACE}/reports/portugal-bundle-diff.txt"
          cp /tmp/pt_carrier_bundle_changes.txt "${GITHUB_WORKSPACE}/reports/pt-carrier-bundles-diff.txt"

          # Generate Portugal changes JSON for machine-readable format
          if [ "$PORTUGAL_CHANGED" = "true" ] || [ "$PT_CARRIER_CHANGED" = "true" ]; then
            python3 "${GITHUB_WORKSPACE}/scripts/generate_pt_changes_ci.py" \
              /tmp/base-bundles \
              /tmp/head-bundles \
              > "${GITHUB_WORKSPACE}/reports/portugal-changes.json" || echo '{}' > "${GITHUB_WORKSPACE}/reports/portugal-changes.json"
          fi

          TITLE="${TITLE_PREFIX}New Carriers/Tags Report: iOS ${IOS_VERSION_LABEL} (${IOS_BUILD})"

          {
            echo "title=${TITLE}"
            echo "run_url=${RUN_URL}"
            echo "portugal_changed=${PORTUGAL_CHANGED}"
            echo "portugal_changes_file=/tmp/portugal_changes.txt"
            echo "pt_carrier_changed=${PT_CARRIER_CHANGED}"
            echo "pt_carrier_changes_file=/tmp/pt_carrier_bundle_changes.txt"
            echo "compare_base=${{ steps.refs.outputs.base_label }}"
            echo "compare_head=${{ steps.refs.outputs.head_label }}"
            echo "ios_version=${IOS_VERSION}"
            echo "ios_build=${IOS_BUILD}"
            echo "ios_is_beta=${IOS_IS_BETA}"
            echo "ios_version_label=${IOS_VERSION_LABEL}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload report artifacts
        if: steps.preflight.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: carrier-bundle-change-report
          path: reports/

      - name: Create GitHub issue with report
        if: steps.preflight.outputs.proceed == 'true'
        uses: actions/github-script@v7
        env:
          REPORT_JSON_PATH: reports/cb-change-report.json
          PT_JSON_PATH: reports/portugal-changes.json
          PORTUGAL_CHANGES_FILE: ${{ steps.issue_data.outputs.portugal_changes_file }}
          PORTUGAL_CHANGED: ${{ steps.issue_data.outputs.portugal_changed }}
          PT_CARRIER_CHANGED: ${{ steps.issue_data.outputs.pt_carrier_changed }}
          PT_CARRIER_CHANGES_FILE: ${{ steps.issue_data.outputs.pt_carrier_changes_file }}
          RUN_URL: ${{ steps.issue_data.outputs.run_url }}
          COMPARE_BASE: ${{ steps.issue_data.outputs.compare_base }}
          COMPARE_HEAD: ${{ steps.issue_data.outputs.compare_head }}
          IOS_VERSION: ${{ steps.issue_data.outputs.ios_version }}
          IOS_BUILD: ${{ steps.issue_data.outputs.ios_build }}
          IOS_IS_BETA: ${{ steps.issue_data.outputs.ios_is_beta }}
          IOS_VERSION_LABEL: ${{ steps.issue_data.outputs.ios_version_label }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          ISSUE_TITLE: ${{ steps.issue_data.outputs.title }}
        with:
          script: |
            const fs = require('fs');
            const MAX_ISSUE_BODY_CHARS = 65536;
            const ISSUE_BODY_TARGET_CHARS = 65000;

            const reportJson = fs.readFileSync(process.env.REPORT_JSON_PATH, 'utf8');
            const report = JSON.parse(reportJson);
            const summary = report.summary || {};
            const newCarriersDetected = Number(summary.new_carriers_detected || 0);
            const newKeysDetected = Number(summary.new_keys_detected || 0);
            const portugalChanged = process.env.PORTUGAL_CHANGED === 'true';
            const portugalChanges = fs.existsSync(process.env.PORTUGAL_CHANGES_FILE)
              ? fs.readFileSync(process.env.PORTUGAL_CHANGES_FILE, 'utf8').trim()
              : '';
            const ptCarrierChanged = process.env.PT_CARRIER_CHANGED === 'true';
            const ptCarrierChanges = fs.existsSync(process.env.PT_CARRIER_CHANGES_FILE)
              ? fs.readFileSync(process.env.PT_CARRIER_CHANGES_FILE, 'utf8').trim()
              : '';
            
            // Load Portugal changes JSON
            let ptJsonData = null;
            let ptJsonText = '';
            if (fs.existsSync(process.env.PT_JSON_PATH)) {
              try {
                ptJsonText = fs.readFileSync(process.env.PT_JSON_PATH, 'utf8');
                ptJsonData = JSON.parse(ptJsonText);
              } catch (e) {
                // Ignore parse errors
              }
            }

            function truncateForBlock(content, maxChars) {
              if (!content || maxChars <= 0) return '';
              if (content.length <= maxChars) return content;
              const notice = '\n\n... [truncated; see workflow artifact `carrier-bundle-change-report` for full details]';
              const sliceLen = Math.max(0, maxChars - notice.length);
              return content.slice(0, sliceLen) + notice;
            }

            const INLINE_DIFF_MAX_CHARS = 14000;
            const portugalInlineDiff = truncateForBlock(portugalChanges, INLINE_DIFF_MAX_CHARS);
            const ptCarrierInlineDiff = truncateForBlock(ptCarrierChanges, INLINE_DIFF_MAX_CHARS);

            const portugalSection = portugalChanged
              ? [
                  '### 🌍 Portugal Country Bundle',
                  '',
                  '✅ **Changes detected** in `Country Bundles/Portugal.bundle`',
                  '',
                  '<details open>',
                  '<summary>View detailed changes</summary>',
                  '',
                  '```diff',
                  portugalInlineDiff,
                  '```',
                  '',
                  '</details>',
                  ''
                ].join('\n')
              : [
                  '### 🌍 Portugal Country Bundle',
                  '',
                  '⚪ No changes detected',
                  ''
                ].join('\n');

            const ptCarrierSection = ptCarrierChanged
              ? [
                  '### 📡 Portugal Carrier Bundles (_pt)',
                  '',
                  '✅ **Changes detected** in carrier bundles matching `Carrier Bundles/*_pt.bundle`',
                  '',
                  '<details open>',
                  '<summary>View detailed changes</summary>',
                  '',
                  '```diff',
                  ptCarrierInlineDiff,
                  '```',
                  '',
                  '</details>',
                  ''
                ].join('\n')
              : [
                  '### 📡 Portugal Carrier Bundles (_pt)',
                  '',
                  '⚪ No changes detected',
                  ''
                ].join('\n');

            // Add machine-readable JSON section if PT changes exist
            let ptJsonSection = '';
            let quickSummary = '';
            if (ptJsonData && ptJsonData.bundles_changed && ptJsonData.bundles_changed.length > 0) {
              // Build quick summary table
              const summaryRows = ptJsonData.bundles_changed.map(bundle => {
                const type = bundle.type === 'country' ? '🌍 Country' : '📡 Carrier';
                const name = bundle.name;
                const versionChange = `${bundle.version_old} → ${bundle.version_new}`;
                return `| ${type} | ${name} | ${versionChange} |`;
              });
              
              quickSummary = [
                '## 📊 Quick Summary',
                '',
                `**iOS Version:** ${ptJsonData.ios_release || 'Unknown'}`,
                `**Build:** ${ptJsonData.ios_build || 'Unknown'}`,
                `**Bundles Changed:** ${ptJsonData.bundles_changed.length}`,
                '',
                '| Type | Name | Version Change |',
                '|------|------|----------------|',
                ...summaryRows,
                ''
              ].join('\n');
              
              ptJsonSection = [
                '## 🤖 Machine-Readable Format',
                '',
                '<details>',
                '<summary>Click to view JSON (for automated processing)</summary>',
                '',
                '```json',
                ptJsonText.trim(),
                '```',
                '',
                '</details>',
                ''
              ].join('\n');
            }

            const topChangedBundles = Array.isArray(report.new_tags_by_bundle)
              ? report.new_tags_by_bundle
                  .map(item => ({
                    bundle: item.bundle,
                    count: Array.isArray(item.new_key_paths) ? item.new_key_paths.length : 0,
                  }))
                  .sort((a, b) => b.count - a.count)
                  .slice(0, 10)
              : [];

            const topBundleLines = topChangedBundles.length > 0
              ? topChangedBundles.map(item => `- \`${item.bundle}\`: ${item.count} new keys`)
              : ['- None'];

            const changeVolumeSection = [
              '## 📈 Change Volume',
              '',
              `- New carriers detected: **${newCarriersDetected}**`,
              `- New plist keys detected: **${newKeysDetected}**`,
              `- Portugal country bundle changed: **${portugalChanged ? 'yes' : 'no'}**`,
              `- Portugal _pt carrier bundles changed: **${ptCarrierChanged ? 'yes' : 'no'}**`,
              '',
              '**Top changed bundles (by new key count):**',
              ...topBundleLines,
              ''
            ].join('\n');

            const iosVersionLabel = (process.env.IOS_VERSION_LABEL || process.env.IOS_VERSION || '').trim();

            const appleReleaseNotesSection = [
              '## 🍎 Apple Release Notes',
              '',
              `[${iosVersionLabel ? `iOS ${iosVersionLabel}` : 'iOS/iPadOS'} Release Notes](https://developer.apple.com/documentation/ios-ipados-release-notes)`,
              ''
            ].join('\n');

            const preamble = [
              quickSummary,
              `## 📝 Report Details`,
              '',
              `- **Compare base:** ${process.env.COMPARE_BASE}`,
              `- **Compare head:** ${process.env.COMPARE_HEAD}`,
              `- **Workflow run:** ${process.env.RUN_URL}`,
              '',
              appleReleaseNotesSection,
              changeVolumeSection,
              portugalSection,
              ptCarrierSection
            ].join('\n');

            const fullArtifactSection = [
              '## 📦 Full Report Artifacts',
              '',
              `Full report files are available as [workflow artifacts](${process.env.RUN_URL}#artifacts).`,
              ''
            ].join('\n');

            const rawNewTags = Array.isArray(report.new_tags) ? report.new_tags : [];
            const newKeyPaths = rawNewTags
              .map(item => {
                if (typeof item === 'string') return item;
                if (item && typeof item === 'object' && typeof item.key_path === 'string') return item.key_path;
                return null;
              })
              .filter(Boolean);

            const uniqueKeyPaths = Array.from(new Set(newKeyPaths)).sort((a, b) => a.localeCompare(b));
            const keyLines = uniqueKeyPaths.length > 0
              ? uniqueKeyPaths.map(keyPath => `- \`${keyPath}\``)
              : ['⚪ None detected'];

            const keySummary = uniqueKeyPaths.length > 0 
              ? `**${uniqueKeyPaths.length}** new plist key${uniqueKeyPaths.length > 1 ? 's' : ''} detected`
              : 'No new plist keys detected';

            const keysHeader = ['## 🔑 Newly Detected Plist Keys', '', keySummary, ''].join('\n');
            const keysFooter = [''].join('\n');
            const reservedChars = preamble.length + ptJsonSection.length + fullArtifactSection.length + keysHeader.length + keysFooter.length + 4;
            const keysBudget = Math.max(0, ISSUE_BODY_TARGET_CHARS - reservedChars);
            
            let keysContent = keyLines.join('\n');
            if (uniqueKeyPaths.length > 0) {
              keysContent = ['<details>', '<summary>View all keys</summary>', '', keysContent, '', '</details>'].join('\n');
            }
            const truncatedKeys = truncateForBlock(keysContent, keysBudget);

            const body = [
              preamble,
              ptJsonSection,
              fullArtifactSection,
              keysHeader,
              truncatedKeys,
              keysFooter,
              '---',
              '',
              '_This issue was automatically generated by the carrier bundle change detection workflow._',
              '_For questions or to manually trigger checks, see the [workflow documentation](../../actions/workflows/carrier-bundle-change-alerts.yml)._'
            ].join('\n');

            let finalBody = body;
            if (finalBody.length > ISSUE_BODY_TARGET_CHARS) {
              const footer = '\n\n---\nIssue body truncated to satisfy GitHub maximum size limit. Use the workflow artifact `carrier-bundle-change-report` for full report files.';
              const limit = Math.max(0, ISSUE_BODY_TARGET_CHARS - footer.length);
              finalBody = finalBody.slice(0, limit) + footer;
            }

            if (finalBody.length > MAX_ISSUE_BODY_CHARS) {
              finalBody = finalBody.slice(0, MAX_ISSUE_BODY_CHARS - 1);
            }

            // Determine labels
            const iosVersionForLabels = (process.env.IOS_VERSION || '').trim();
            const iosBuildForLabels = (process.env.IOS_BUILD || '').trim();
            const iosIsBetaForLabels = process.env.IOS_IS_BETA === 'true'
              || /[a-z]$/i.test(iosBuildForLabels);

            const labels = ['carrier-bundles', 'automated-report'];
            if (iosVersionForLabels) labels.push(`ios-${iosVersionForLabels}`);
            if (iosIsBetaForLabels) {
              const betaMatch = (process.env.IOS_VERSION_LABEL || '').match(/beta\s*(\d+)/i);
              labels.push(betaMatch ? `beta${betaMatch[1]}` : 'beta');
            } else {
              labels.push('stable');
            }

            const dedupedLabels = Array.from(new Set(labels));

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: process.env.ISSUE_TITLE,
              body: finalBody,
              labels: dedupedLabels
            });

      - name: Clean up worktree
        if: always()
        run: |
          git worktree remove /tmp/base-bundles --force || true
          git worktree remove /tmp/head-bundles --force || true
          rm -rf /tmp/base-ipsw /tmp/head-ipsw /tmp/base-extract /tmp/head-extract
