name: Update Carrier Bundles
on:
  workflow_dispatch:
    inputs:
      device:
        description: "iOS device identifier (for example: iPhone18,3 for iPhone 17 Pro Max)"
        required: false
        default: iPhone18,3
env:
  DEVICE: ${{ github.event.inputs.device || vars.DEVICE }}

jobs:
  ipsw-extraction:
    name: Get Latest iOS IPSW and Extract Carrier Bundles
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          BUILD_DEPS='fuse3 unzip lzma libfuse3-dev bzip2 libbz2-dev libz-dev cmake build-essential git libattr1-dev'

          sudo apt update
          sudo apt install $BUILD_DEPS -y
      
      - name: Load FUSE Kernel Module
        run: sudo modprobe fuse

      - name: Install sgan81/apfs-fuse
        run: |
          git clone https://github.com/sgan81/apfs-fuse.git /tmp/apfs-fuse
          cd /tmp/apfs-fuse
          git submodule init
          git submodule update
          mkdir build
          cd build
          cmake ..
          sudo make install

          cd ${GITHUB_WORKSPACE}
          rm -rf /tmp/apfs-fuse
      
      - name: Install blacktop/ipsw
        run: |
          DEB_ARCH="arm64"

          IPSW_DEB_URL=$(curl -s https://api.github.com/repos/blacktop/ipsw/releases/latest | \
          jq -r '(.assets[].browser_download_url | select(. | contains('\"$DEB_ARCH.deb\"')) | select(. | contains("ipsw_")))')

          curl -sL -o /tmp/ipsw.deb $IPSW_DEB_URL
          sudo dpkg -i /tmp/ipsw.deb
          rm /tmp/ipsw.deb
      
      - name: Download Latest IPSW File
        run: |
          if [ -z "${DEVICE}" ]; then
            echo "::error::Repository variable DEVICE is not set. Set it to a valid device identifier (for example: iPhone15,2)."
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/ipsw"
          cd "${RUNNER_TEMP}/ipsw"
          ipsw download ipsw --device "${DEVICE}" --latest --no-color --output "${RUNNER_TEMP}/ipsw"
      
      - name: Extract Carrier Bundles From IPSW
        run: |
          mkdir -p /tmp/ipsw
          cd /tmp/ipsw
          ipsw extract --files --pattern '.*Bundles.*iPhone.*\.bundle.*$' --output /tmp/ipsw "${RUNNER_TEMP}"/ipsw/*.ipsw

      - name: Clean Up and Move Carrier Bundles to Repo
        run: |
          rm -rf ${GITHUB_WORKSPACE}/Country\ Bundles
          rm -rf ${GITHUB_WORKSPACE}/Carrier\ Bundles

          mkdir -p ${GITHUB_WORKSPACE}/Country\ Bundles
          mkdir -p ${GITHUB_WORKSPACE}/Carrier\ Bundles

          sudo chown -R $USER /tmp/ipsw/*/root
          mv /tmp/ipsw/*/root/System/Library/CountryBundles/iPhone/* ${GITHUB_WORKSPACE}/Country\ Bundles
          mv /tmp/ipsw/*/root/System/Library/Carrier\ Bundles/iPhone/* ${GITHUB_WORKSPACE}/Carrier\ Bundles

      - name: Update Metadata
        run: |
          cd ${GITHUB_WORKSPACE}

          rm README.md
          cp .github/workflows/README-TEMPLATE.md README.md

          IPSW_INFO=$(ipsw info "${RUNNER_TEMP}"/ipsw/*.ipsw --json --no-color)
          echo $IPSW_INFO > ipsw_metadata.json
          
          CURRENT_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          IOS_VERSION=$(echo $IPSW_INFO | jq -r '.version')
          IOS_BUILD=$(echo $IPSW_INFO | jq -r '.build')
          IOS_BUILD_TIMESTAMP=$(echo $IPSW_INFO | jq -r '.devices[0].timestamp')
          DEVICE_NAME=$(echo $IPSW_INFO | jq -r '.devices[0].name')
          DEVICE_PRODNAME=$(echo $IPSW_INFO | jq -r '.devices[0].product')

          sed -i "s/(CURRENT_DATE)/$CURRENT_DATE/g" README.md
          sed -i "s/(IOS_VERSION)/$IOS_VERSION/g" README.md
          sed -i "s/(IOS_BUILD)/$IOS_BUILD/g" README.md
          sed -i "s/(IOS_BUILD_TIMESTAMP)/$IOS_BUILD_TIMESTAMP/g" README.md
          sed -i "s/(DEVICE_NAME)/$DEVICE_NAME/g" README.md
          sed -i "s/(DEVICE_PRODNAME)/$DEVICE_PRODNAME/g" README.md
          
      - name: Commit Changes
        run: |
          cd ${GITHUB_WORKSPACE}

          IOS_VERSION=$(jq -r '.version' ipsw_metadata.json)
          IOS_BUILD=$(jq -r '.build' ipsw_metadata.json)

          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add .
          git commit -m "iOS $IOS_VERSION ($IOS_BUILD) - Update Carrier Bundles"
          git push
