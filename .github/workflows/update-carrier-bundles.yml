name: Update Carrier Bundles
on:
  workflow_dispatch:
    inputs:
      device:
        description: "iOS device identifier (for example: iPhone18,3 for iPhone 17 Pro Max)"
        required: false
        default: iPhone18,3
  schedule:
    - cron: '17 */6 * * *'
env:
  DEVICE: ${{ github.event.inputs.device || 'iPhone18,3' }}

jobs:
  ipsw-extraction:
    name: Check Latest iOS Build and Update Carrier Bundles
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install blacktop/ipsw
        run: |
          DEB_ARCH="arm64"
          case "$DEB_ARCH" in
            amd64) DEB_ASSET_ARCH="x86_64" ;;
            arm64) DEB_ASSET_ARCH="arm64" ;;
            *) DEB_ASSET_ARCH="$DEB_ARCH" ;;
          esac

          IPSW_DEB_URL=$(curl -fsSL https://api.github.com/repos/blacktop/ipsw/releases/latest | \
          jq -r --arg arch "$DEB_ASSET_ARCH" '[.assets[].browser_download_url | select(test("/ipsw_[^/]*_linux_" + $arch + "\\.deb$"))] | first // empty')

          if [ -z "$IPSW_DEB_URL" ]; then
            echo "::error::Failed to resolve ipsw .deb URL for architecture ${DEB_ARCH} (asset arch ${DEB_ASSET_ARCH})."
            exit 1
          fi

          echo "Resolved ipsw .deb URL: $IPSW_DEB_URL"

          curl -fsSL -o /tmp/ipsw.deb "$IPSW_DEB_URL"
          sudo dpkg -i /tmp/ipsw.deb
          rm /tmp/ipsw.deb

      - name: Check if new iOS build is available
        id: check_build
        run: |
          if [ -z "${DEVICE}" ]; then
            echo "::error::DEVICE is not set. Provide workflow input 'device'."
            exit 1
          fi

          CURRENT_BUILD=$(jq -r '.build // empty' ipsw_metadata.json 2>/dev/null || true)
          LATEST_BUILD=$(ipsw download ipsw --device "${DEVICE}" --show-latest-build --no-color | tr -d '\r' | tail -n1 | xargs)
          LATEST_VERSION=$(ipsw download ipsw --device "${DEVICE}" --show-latest-version --no-color | tr -d '\r' | tail -n1 | xargs)

          if [ -z "${LATEST_BUILD}" ]; then
            echo "::error::Failed to resolve latest iOS build for device ${DEVICE}."
            exit 1
          fi

          if [ -n "${CURRENT_BUILD}" ] && [ "${CURRENT_BUILD}" = "${LATEST_BUILD}" ]; then
            SHOULD_UPDATE="false"
          else
            SHOULD_UPDATE="true"
          fi

          echo "current_build=${CURRENT_BUILD}" >> "$GITHUB_OUTPUT"
          echo "latest_build=${LATEST_BUILD}" >> "$GITHUB_OUTPUT"
          echo "latest_version=${LATEST_VERSION}" >> "$GITHUB_OUTPUT"
          echo "should_update=${SHOULD_UPDATE}" >> "$GITHUB_OUTPUT"

          echo "Current build: ${CURRENT_BUILD:-none}"
          echo "Latest build: ${LATEST_BUILD}"
          echo "Latest version: ${LATEST_VERSION}"
          echo "Should update: ${SHOULD_UPDATE}"

      - name: No new iOS build detected
        if: steps.check_build.outputs.should_update == 'false'
        run: echo "No new build for ${DEVICE} (still ${{ steps.check_build.outputs.current_build }}); skipping download/extraction."

      - name: Install Build Dependencies
        if: steps.check_build.outputs.should_update == 'true'
        run: |
          BUILD_DEPS='fuse3 unzip lzma libfuse3-dev bzip2 libbz2-dev libz-dev cmake build-essential git libattr1-dev'

          sudo apt update
          sudo apt install $BUILD_DEPS -y
      
      - name: Load FUSE Kernel Module
        if: steps.check_build.outputs.should_update == 'true'
        run: sudo modprobe fuse

      - name: Install sgan81/apfs-fuse
        if: steps.check_build.outputs.should_update == 'true'
        run: |
          git clone https://github.com/sgan81/apfs-fuse.git /tmp/apfs-fuse
          cd /tmp/apfs-fuse
          git submodule init
          git submodule update
          mkdir build
          cd build
          cmake ..
          sudo make install

          cd ${GITHUB_WORKSPACE}
          rm -rf /tmp/apfs-fuse
      
      - name: Download Latest IPSW File
        if: steps.check_build.outputs.should_update == 'true'
        run: |
          if [ -z "${DEVICE}" ]; then
            echo "::error::Repository variable DEVICE is not set. Set it to a valid device identifier (for example: iPhone15,2)."
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/ipsw"
          cd "${RUNNER_TEMP}/ipsw"
          ipsw download ipsw --device "${DEVICE}" --latest --no-color --output "${RUNNER_TEMP}/ipsw"
      
      - name: Extract Carrier Bundles From IPSW
        if: steps.check_build.outputs.should_update == 'true'
        run: |
          mkdir -p /tmp/ipsw
          cd /tmp/ipsw
          ipsw extract --files --pattern '.*Bundles.*iPhone.*\.bundle.*$' --output /tmp/ipsw "${RUNNER_TEMP}"/ipsw/*.ipsw

      - name: Clean Up and Move Carrier Bundles to Repo
        if: steps.check_build.outputs.should_update == 'true'
        run: |
          rm -rf ${GITHUB_WORKSPACE}/Country\ Bundles
          rm -rf ${GITHUB_WORKSPACE}/Carrier\ Bundles

          mkdir -p ${GITHUB_WORKSPACE}/Country\ Bundles
          mkdir -p ${GITHUB_WORKSPACE}/Carrier\ Bundles

          sudo chown -R $USER /tmp/ipsw/*/root
          mv /tmp/ipsw/*/root/System/Library/CountryBundles/iPhone/* ${GITHUB_WORKSPACE}/Country\ Bundles
          mv /tmp/ipsw/*/root/System/Library/Carrier\ Bundles/iPhone/* ${GITHUB_WORKSPACE}/Carrier\ Bundles

      - name: Update Metadata
        if: steps.check_build.outputs.should_update == 'true'
        run: |
          cd ${GITHUB_WORKSPACE}

          rm README.md
          cp .github/workflows/README-TEMPLATE.md README.md

          IPSW_INFO=$(ipsw info "${RUNNER_TEMP}"/ipsw/*.ipsw --json --no-color)
          echo $IPSW_INFO > ipsw_metadata.json
          
          CURRENT_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          IOS_VERSION=$(echo $IPSW_INFO | jq -r '.version')
          IOS_BUILD=$(echo $IPSW_INFO | jq -r '.build')
          IOS_BUILD_TIMESTAMP=$(echo $IPSW_INFO | jq -r '.devices[0].timestamp')
          DEVICE_NAME=$(echo $IPSW_INFO | jq -r '.devices[0].name')
          DEVICE_PRODNAME=$(echo $IPSW_INFO | jq -r '.devices[0].product')

          sed -i "s/(CURRENT_DATE)/$CURRENT_DATE/g" README.md
          sed -i "s/(IOS_VERSION)/$IOS_VERSION/g" README.md
          sed -i "s/(IOS_BUILD)/$IOS_BUILD/g" README.md
          sed -i "s/(IOS_BUILD_TIMESTAMP)/$IOS_BUILD_TIMESTAMP/g" README.md
          sed -i "s/(DEVICE_NAME)/$DEVICE_NAME/g" README.md
          sed -i "s/(DEVICE_PRODNAME)/$DEVICE_PRODNAME/g" README.md
          
      - name: Commit Changes
        if: steps.check_build.outputs.should_update == 'true'
        run: |
          cd ${GITHUB_WORKSPACE}

          IOS_VERSION=$(jq -r '.version' ipsw_metadata.json)
          IOS_BUILD=$(jq -r '.build' ipsw_metadata.json)

          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes detected; skipping commit and push."
            exit 0
          fi
          git commit -m "iOS $IOS_VERSION ($IOS_BUILD) - Update Carrier Bundles"
          git push
